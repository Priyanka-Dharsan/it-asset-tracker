bundle:
  name: it-asset-tracker

variables:
  sql_warehouse_id:
    description: SQL Warehouse ID

resources:
  apps:
    app:
      name: "it-asset-tracker"
      description: "IT Asset Tracker using Appkit "
      source_code_path: ./

      # Start the app automatically on deploy.
      lifecycle:
        started: true
      # Uncomment to enable on behalf of user API scopes. Available scopes: sql, genie, files, model-serving
      user_api_scopes:
        - sql

      # The resources which this app has access to.
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.sql_warehouse_id}
            permission: CAN_USE
        - name: postgres
          postgres:
            branch: projects/it-assets-db/branches/production
            database: projects/it-assets-db/branches/production/databases/databricks-postgres
            permission: CAN_CONNECT_AND_CREATE

targets:
  default:
    default: true
    workspace:
      host: https://dbc-345cc8cc-d9ef.cloud.databricks.com

    variables:
      sql_warehouse_id: d7bd70479efc60e4
